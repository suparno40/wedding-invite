<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Pernikahan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap');
        :root { --gold: #d4af37; --dark-green: #00332c; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--dark-green); color: white; overflow-x: hidden; }
        .font-aesthetic { font-family: 'Great Vibes', cursive; }
        section { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; position: relative; border-bottom: 1px solid var(--gold); }
        
        /* Container khusus untuk membungkus konten di dalam frame */
        .frame-container {
            position: relative;
            width: 100%;
            max-width: 500px; /* Menyesuaikan ukuran frame agar tidak terlalu lebar di PC */
            aspect-ratio: 1 / 1; /* Karena gambar frame Anda berbentuk kotak (square) */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px; /* Memberi ruang agar tulisan tidak menabrak garis emas */
        }

        .frame-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            z-index: 0;
            pointer-events: none;
        }

        .frame-content {
            position: relative;
            z-index: 10;
            text-align: center;
        }
    </style>
</head>
<body>

    <audio id="musik" loop>
        <source src="https://www.bensound.com/bensound-music/bensound-love.mp3" type="audio/mp3">
    </audio>

    <!-- SLIDE 1: COVER DENGAN FRAME UTAMA -->
    <section id="slide1">
        <div class="frame-container animate__animated animate__zoomIn">
            <!-- Gambar Frame sebagai Background Konten -->
            <img src="frame.png" class="frame-background" alt="frame-pembungkus">
            
            <!-- Konten yang masuk ke dalam frame -->
            <div class="frame-content">
                <h2 class="tracking-[0.3em] uppercase text-[10px] md:text-xs mb-2">Undangan Pernikahan</h2>
                
                <div class="w-32 h-32 md:w-40 md:h-40 rounded-full border-2 border-gold p-1 mb-4 mx-auto overflow-hidden">
                     <img src="https://via.placeholder.com/300" class="w-full h-full object-cover rounded-full" alt="Mempelai">
                </div>

                <h1 class="text-2xl md:text-3xl font-aesthetic text-amber-400 mb-4 leading-relaxed">
                    Umi & Ircham
                </h1>

                <div class="bg-white/5 backdrop-blur-sm p-3 rounded-lg border border-white/10 mx-auto max-w-[200px] mb-4">
                    <p class="text-[9px] italic text-amber-200">Yth:</p>
                    <h3 id="nama-tamu" class="text-sm font-bold truncate">Tamu Undangan</h3>
                </div>

                <button onclick="mulaiUndangan()" class="px-6 py-2 bg-amber-500 text-dark-green text-sm font-bold rounded-full animate-bounce shadow-lg">
                    Buka Undangan
                </button>
            </div>
        </div>
    </section>

    <!-- SLIDE 2 - 5 TETAP SAMA SEPERTI SEBELUMNYA -->
    <section id="slide2" class="hidden text-center bg-black/20">
        <h2 class="text-3xl font-aesthetic text-amber-400 mb-10">Mempelai</h2>
        <div class="space-y-8 px-4">
            <div>
                <h3 class="text-2xl font-bold text-amber-200">Umi Nurmalisa Munaki Iswanto</h3>
                <p class="text-sm">Putri dari Bpk. Munaki Iswanto & Ibu Lilik Malika (Almh)</p>
            </div>
            <div class="text-4xl font-aesthetic text-amber-400">&</div>
            <div>
                <h3 class="text-2xl font-bold text-amber-200">Muhammad Ircham Chamid</h3>
                <p class="text-sm">Putra dari Bpk. Anwari (Alm) & Ibu. Syfa'ah</p>
            </div>
        </div>
    </section>

    <!-- Slide lainnya (Slide 3, 4, 5) bisa diteruskan sesuai kode sebelumnya -->

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        document.getElementById('nama-tamu').innerText = urlParams.get('to') || 'Tamu Spesial';

        function mulaiUndangan() {
            document.getElementById('musik').play();
            const slides = ['slide2']; // Tambahkan id slide lain di sini (slide3, slide4, dst)
            slides.forEach(id => {
                const el = document.getElementById(id);
                if(el) {
                    el.classList.remove('hidden');
                    el.classList.add('animate__animated', 'animate__fadeIn');
                }
            });
            document.getElementById('slide2').scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
