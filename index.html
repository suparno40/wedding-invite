<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Pernikahan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap');
        :root { --gold: #d4af37; --dark-green: #00332c; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--dark-green); color: white; overflow-x: hidden; }
        .font-aesthetic { font-family: 'Great Vibes', cursive; }
        
        section { 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            padding: 2rem; 
            position: relative; 
            border-bottom: 1px solid var(--gold); 
        }

        /* CSS KHUSUS FRAME FULL PINGGIRAN */
        .full-frame {
            position: absolute;
            width: 150px; /* Ukuran hiasan di pojok */
            z-index: 50;
            pointer-events: none;
            /* Trik menghilangkan background hitam pada gambar */
            mix-blend-mode: screen; 
            opacity: 0.8;
        }
        @media (min-width: 768px) { .full-frame { width: 250px; } }
    </style>
</head>
<body>

    <audio id="musik" loop>
        <source src="https://www.bensound.com/bensound-music/bensound-love.mp3" type="audio/mp3">
    </audio>

    <!-- SLIDE 1: COVER DENGAN HIASAN DI POJOK-POJOK -->
    <section id="slide1" class="text-center">
        <!-- Hiasan di 4 Pojok Layar -->
        <img src="frame.jpg" class="full-frame top-0 left-0" alt="ornamen">
        <img src="frame.jpg" class="full-frame top-0 right-0 scale-x-[-1]" alt="ornamen">
        <img src="frame.jpg" class="full-frame bottom-0 left-0 scale-y-[-1]" alt="ornamen">
        <img src="frame.jpg" class="full-frame bottom-0 right-0 scale-x-[-1] scale-y-[-1]" alt="ornamen">

        <div class="animate__animated animate__fadeIn relative z-10">
            <h2 class="tracking-[0.5em] uppercase text-xs mb-6">Undangan Pernikahan</h2>
            
            <div class="w-44 h-44 rounded-full border-4 border-gold p-2 mb-8 mx-auto overflow-hidden shadow-2xl">
                 <img src="https://via.placeholder.com/300" class="w-full h-full object-cover rounded-full" alt="Mempelai">
            </div>

            <h1 class="text-5xl font-aesthetic text-amber-400 mb-6 px-4">
                Umi & Ircham
            </h1>

            <div class="bg-white/10 backdrop-blur-md p-4 rounded-lg border border-white/20 mx-auto max-w-xs mb-8">
                <p class="text-xs italic text-amber-200">Kepada Yth:</p>
                <h3 id="nama-tamu" class="text-xl font-bold">Tamu Spesial</h3>
            </div>

            <button onclick="mulaiUndangan()" class="px-10 py-3 bg-amber-500 text-dark-green font-bold rounded-full animate-bounce shadow-xl uppercase tracking-widest text-sm">
                Buka Undangan
            </button>
        </div>
    </section>

    <!-- SLIDE 2: PROFIL -->
    <section id="slide2" class="hidden text-center bg-black/20">
        <!-- Hiasan pojok juga bisa ditaruh di sini jika ingin konsisten -->
        <img src="frame.jpg" class="full-frame top-0 left-0 opacity-40" style="mix-blend-mode: screen;">
        
        <h2 class="text-3xl font-aesthetic text-amber-400 mb-10">Mempelai</h2>
        <div class="space-y-8 px-4">
            <div>
                <h3 class="text-2xl font-bold text-amber-200">Umi Nurmalisa Munaki Iswanto</h3>
                <p class="text-sm">Putri dari Bpk. Munaki Iswanto & Ibu Lilik Malika (Almh)</p>
            </div>
            <div class="text-4xl font-aesthetic text-amber-400">&</div>
            <div>
                <h3 class="text-2xl font-bold text-amber-200">Muhammad Ircham Chamid</h3>
                <p class="text-sm">Putra dari Bpk. Anwari (Alm) & Ibu. Syfa'ah</p>
            </div>
        </div>
    </section>

    <!-- Script tetap sama -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        document.getElementById('nama-tamu').innerText = urlParams.get('to') || 'Tamu Spesial';

        function mulaiUndangan() {
            document.getElementById('musik').play();
            const slides = ['slide2']; // Tambahkan slide3, 4, 5 di sini
            slides.forEach(id => {
                document.getElementById(id).classList.remove('hidden');
            });
            document.getElementById('slide2').scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
