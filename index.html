<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Pernikahan</title>
    <!-- Tailwind CSS untuk desain responsif & cepat -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;700&display=swap');
        .font-aesthetic { font-family: 'Great Vibes', cursive; }
        body { font-family: 'Montserrat', sans-serif; }
    </style>
</head>
<body class="bg-stone-100 text-stone-800">

    <!-- Cover Depan -->
    <section class="h-screen flex flex-col items-center justify-center text-center p-6 bg-white shadow-inner">
        <h2 class="text-xl tracking-widest uppercase mb-4">The Wedding of</h2>
        <h1 class="text-6xl font-aesthetic text-amber-600 my-4">Nama Pria & Nama Wanita</h1>
        
        <!-- Fitur Custom Nama Tamu -->
        <div class="mt-8 p-4 border border-amber-200 rounded-lg">
            <p class="text-sm italic">Kepada Yth. Bapak/Ibu/Saudara/i:</p>
            <h3 id="nama-tamu" class="text-2xl font-bold mt-2 text-stone-700">-</h3>
        </div>

        <button onclick="bukaUndangan()" class="mt-10 px-8 py-3 bg-amber-600 text-white rounded-full hover:bg-amber-700 transition">
            Buka Undangan
        </button>
    </section>

    <!-- Script Sederhana -->
    <script>
        // Logika mengambil nama tamu dari link (?to=NamaTamu)
        const urlParams = new URLSearchParams(window.location.search);
        const tamu = urlParams.get('to') || 'Tamu Spesial';
        document.getElementById('nama-tamu').innerText = tamu;

        function bukaUndangan() {
            alert("Musik akan diputar dan undangan terbuka! (Ini adalah kerangka dasar)");
            // Di sini nanti kita tambahkan fungsi scroll dan play musik
        }
    </script>
</body>
</html>
